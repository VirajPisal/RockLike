    <path d="M40 0 L80 75 L70 75 L35 15 L20 45 L10 45 Z" fill="#0D529C"/>
    <path d="M40 0 L0 75 L15 75 L40 28 L55 58 L45 58 Z" fill="#0D529C"/>
    <path d="M10 75 L80 75 L75 80 L5 80 Z" fill="#0D529C"/>
    
    <!-- Inner Gold Nested Chevron -->
    <path d="M35 30 L55 68 L22 68 L15 68 L35 30 Z" fill="#D4A024" opacity="0.95"/>
    <path d="M25 60 L50 60 L45 68 L20 68 Z" fill="#D4A024"/>
